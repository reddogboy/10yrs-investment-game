<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมจำลองการลงทุน 10 ปี</title>

    <!-- 1. โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. โหลด React & ReactDOM -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>

    <!-- 3. โหลดไลบรารีสำหรับวาดกราฟ -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js"></script>

    <!-- 4. โหลด Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <style>
        body { 
            background-color: #F6F9F8; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }
        .crash-text {
            color: #991B1B !important; /* แดงเลือดหมู */
            font-size: 1.3em !important;
            font-weight: 900 !important;
            text-shadow: 0px 2px 4px rgba(153, 27, 27, 0.3);
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { LineChart, Line, XAxis, YAxis, Tooltip, CartesianGrid, ResponsiveContainer, Legend } = Recharts;

        // ---------------- ชุดสี (Palette) ----------------
        const C = {
          bg: "#F6F9F8", card: "#FFFFFF", ink: "#12292B", muted: "#5E7476",
          line: "#E2EAE9", teal: "#0E5A5F", tealSoft: "#DDEBEA",
          gold: "#C9A02C", goldSoft: "#F5EDD6", red: "#B3452F", redSoft: "#F7E3DE",
          green: "#2E7D5B", greenSoft: "#DFEEE7", rust: "#B3572F", blue: "#3E6B8F",
        };

        // ---------------- ข้อมูลสินทรัพย์ ----------------
        const ASSETS = [
          { key: "cash", name: "กองทุนตลาดเงิน", color: "#5E7476", desc: "ผลตอบแทน ~1.5%, ไม่เคยติดลบ" },
          { key: "bond", name: "กองทุนตราสารหนี้", color: "#3E6B8F", desc: "ผลตอบแทน ~2.5%, ผันผวนต่ำ" },
          { key: "equity", name: "กองทุนหุ้นโลก", color: "#0E5A5F", desc: "ผลตอบแทนเฉลี่ย ~8%, อาจร่วงหนักถึง −40%" },
          { key: "gold", name: "กองทุนทองคำ", color: "#C9A02C", desc: "ผลตอบแทน ~3%, ใช้กระจายความเสี่ยงจากหุ้น" },
        ];

        // ---------------- Quick Presets ----------------
        const PRESETS = [
          { name: "🚀 สายซิ่ง (หุ้น 80%)", vals: { cash: 5, bond: 5, equity: 80, gold: 10 } },
          { name: "🐢 สายชิล (หนี้ 70%)", vals: { cash: 10, bond: 70, equity: 15, gold: 5 } },
          { name: "⚖️ สายสมดุล (เท่ากัน)", vals: { cash: 25, bond: 25, equity: 25, gold: 25 } },
          { name: "🛡️ สายเกราะ (ทอง 50%)", vals: { cash: 10, bond: 10, equity: 30, gold: 50 } },
        ];

        // ---------------- ฟังก์ชันช่วยจัดรูปแบบตัวเลข ----------------
        const fmt = (n) => "฿" + Math.round(n).toLocaleString("th-TH");
        const fmtShort = (n) => {
          const a = Math.abs(n), s = n < 0 ? "-" : "";
          if (a >= 1e6) return s + "฿" + (a / 1e6).toFixed(2) + "M";
          if (a >= 1e3) return s + "฿" + (a / 1e3).toFixed(0) + "K";
          return s + "฿" + Math.round(a).toLocaleString("th-TH");
        };
        const pctf = (x) => (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";

        // ---------------- การ์ดเหตุการณ์จำลอง ----------------
        const CARDS = [
          { id: "bull", emoji: "🐂", name: "ตลาดกระทิงดุ", desc: "ตลาดพุ่งทะยาน — สินทรัพย์เสี่ยงราคาพุ่ง", w: 18, r: { cash: 1.5, bond: 2.5, equity: 27, gold: -4 } },
          { id: "steady", emoji: "📈", name: "เติบโตสม่ำเสมอ", desc: "เศรษฐกิจดี — เติบโตตามปกติ", w: 27, r: { cash: 1.5, bond: 4, equity: 14, gold: 3 } },
          { id: "recovery", emoji: "🌱", name: "เศรษฐกิจฟื้นตัว", desc: "ความมั่นใจกลับมาหลังผ่านพ้นช่วงยากลำบาก", w: 12, r: { cash: 1.2, bond: 3, equity: 24, gold: -3 } },
          { id: "boring", emoji: "😴", name: "ปีที่ซบเซา", desc: "ไม่มีอะไรเกิดขึ้นมาก — ตลาดทรงตัว", w: 13, r: { cash: 1.5, bond: 3.5, equity: 6, gold: 2 } },
          { id: "inflation", emoji: "🔥", name: "เงินเฟ้อพุ่ง", desc: "ข้าวของแพงขึ้น — เงินสดด้อยค่า ทองคำโดดเด่น", w: 9, r: { cash: 0.8, bond: -2, equity: -4, gold: 15 } },
          { id: "ratehike", emoji: "🏦", name: "ขึ้นดอกเบี้ย", desc: "ธนาคารกลางเข้มงวด — หุ้นและพันธบัตรสั่นคลอน", w: 8, r: { cash: 3, bond: -4, equity: -8, gold: -2 } },
          { id: "crisis", emoji: "🌏", name: "วิกฤตความกลัว", desc: "ปัญหาภูมิรัฐศาสตร์ — นักลงทุนหนีไปหาสินทรัพย์ปลอดภัย", w: 7, r: { cash: 1.5, bond: 6, equity: -17, gold: 12 } },
          { id: "crash", emoji: "💥", name: "ตลาดพังทลาย", desc: "เทขายตื่นตระหนก — หุ้นร่วงหนัก ทองคำคือที่หลบภัย", w: 6, r: { cash: 1.5, bond: 5, equity: -37, gold: 18 } },
        ];
        const BEAR_CARD = { id: "bear", emoji: "🐻", name: "ตลาดหมีต่อเนื่อง", desc: "ควันหลงจากตลาดพังทลาย — แรงเทขายยังมีต่อเนื่อง", w: 0, r: { cash: 1.5, bond: 3, equity: -15, gold: 8 } };

        const rnd = (a, b) => a + Math.random() * (b - a);
        const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

        function drawCard(excludeCrash = false) {
          const pool = excludeCrash ? CARDS.filter((c) => c.id !== "crash") : CARDS;
          const total = pool.reduce((s, c) => s + c.w, 0);
          let x = Math.random() * total;
          for (const c of pool) { x -= c.w; if (x <= 0) return c; }
          return pool[pool.length - 1];
        }

        function generateDeck() {
          let cards = Array.from({ length: 10 }, () => drawCard());
          let crashIdx = cards.map((c, i) => (c.id === "crash" ? i : -1)).filter((i) => i >= 0);
          while (crashIdx.length > 2) {
            const kill = crashIdx[Math.floor(Math.random() * crashIdx.length)];
            cards[kill] = drawCard(true);
            crashIdx = cards.map((c, i) => (c.id === "crash" ? i : -1)).filter((i) => i >= 0);
          }
          if (crashIdx.length === 0) {
            cards[Math.floor(Math.random() * 10)] = CARDS.find((c) => c.id === "crash");
          }
          for (let i = 0; i < cards.length - 1; i++) {
            if (cards[i].id === "crash" && cards[i + 1].id !== "crash" && Math.random() < 0.5) {
              cards[i + 1] = BEAR_CARD;
            }
          }
          return cards.map((card) => {
            const eqN = rnd(-5, 5);
            const r = {
              cash: Math.max(0.3, card.r.cash + rnd(-0.4, 0.4)) / 100,
              bond: (card.r.bond + rnd(-2, 2)) / 100,
              equity: clamp(card.r.equity + eqN, -40, 32) / 100,
              gold: (card.r.gold - 0.6 * eqN + rnd(-3, 3)) / 100,
            };
            return { card, r };
          });
        }

        // ---------------- ค่าคงที่ของเกม ----------------
        const DCA = 100000, START = 1000000, TURNS = 10;
        const INFL = 0.025, TARGET = 0.04;
        const fvAt = (r) => START * Math.pow(1 + r, TURNS) + DCA * ((Math.pow(1 + r, TURNS) - 1) / r) * (1 + r);
        const INFL_W = fvAt(INFL), TARGET_W = fvAt(TARGET);
        const paceAt = (t) => START * Math.pow(1 + TARGET, t) + DCA * ((Math.pow(1 + TARGET, t) - 1) / TARGET) * (1 + TARGET);

        function runBenchmark(deck, weights) {
          let hold = {};
          ASSETS.forEach((a) => { hold[a.key] = 0; });
          let w = START;
          const path = [];
          for (let t = 0; t < TURNS; t++) {
            const total = Object.values(hold).reduce((s, v) => s + v, 0) + (t === 0 ? START + DCA : DCA);
            ASSETS.forEach((a) => { hold[a.key] = total * weights[a.key]; });
            ASSETS.forEach((a) => { hold[a.key] *= 1 + deck[t].r[a.key]; });
            w = Object.values(hold).reduce((s, v) => s + v, 0);
            path.push(w);
          }
          return path;
        }

        function investorType(avgW, worstRet) {
          if (avgW.equity >= 0.65) return { emoji: "🎲", name: "นักบิดกระทิงเปลี่ยว", desc: "เน้นลงทุนหุ้นเป็นหลัก สวิงแรง ต้องใจแข็ง" };
          if (avgW.cash + avgW.bond >= 0.65) return { emoji: "🐢", name: "เต่าปลอดภัย", desc: "ช้าแต่ชัวร์ หลับสบาย แต่อาจแพ้เงินเฟ้อ" };
          if (avgW.gold >= 0.35) return { emoji: "🐉", name: "มังกรทองคำ", desc: "สะสมทองคำป้องกันความเสี่ยง ไม่กลัวตลาดพัง" };
          if (worstRet > -0.10) return { emoji: "🚢", name: "กัปตันสุดนิ่ง", desc: "รักษาสมดุลได้ดีเยี่ยม ผ่านพ้นได้ทุกมรสุม" };
          return { emoji: "⚖️", name: "นักกลยุทธ์สมดุล", desc: "กระจายความเสี่ยงยอดเยี่ยม นักลงทุนระยะยาวตัวจริง" };
        }

        // ---------------- UI Components ----------------
        function AllocSlider({ asset, value, onChange }) {
          return (
            <div style={{ marginBottom: 8 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                <span style={{ fontSize: 12.5, fontWeight: 700, color: asset.color }}>
                  {asset.name} <span style={{ fontWeight: 400, fontSize: 10.5, color: C.muted }}>· {asset.desc}</span>
                </span>
                <span style={{ fontSize: 13, fontWeight: 700, color: asset.color, fontVariantNumeric: "tabular-nums" }}>{value}%</span>
              </div>
              <input type="range" min={0} max={100} step={1} value={value}
                onChange={(e) => onChange(parseInt(e.target.value))}
                style={{ width: "100%", accentColor: asset.color, cursor: "pointer" }} />
            </div>
          );
        }

        function MixBar({ weights }) {
          return (
            <div style={{ display: "flex", height: 14, borderRadius: 7, overflow: "hidden", border: `1px solid ${C.line}` }}>
              {ASSETS.map((a) => weights[a.key] > 0 && (
                <div key={a.key} style={{ width: `${weights[a.key]}%`, background: a.color, transition: 'width 0.1s' }} title={`${a.name} ${weights[a.key]}%`} />
              ))}
            </div>
          );
        }

        function TurnDots({ turn }) {
          return (
            <div style={{ display: "flex", gap: 5, justifyContent: "center", margin: "4px 0" }}>
              {Array.from({ length: TURNS }, (_, i) => (
                <div key={i} style={{
                  width: 9, height: 9, borderRadius: 5,
                  background: i < turn ? C.teal : i === turn ? C.gold : C.line,
                }} />
              ))}
            </div>
          );
        }

        // ---------------- Main Component ----------------
        function App() {
          const [deck, setDeck] = useState(generateDeck);
          const [turn, setTurn] = useState(0); 
          const [phase, setPhase] = useState("start"); 
          const [holdings, setHoldings] = useState({ cash: START, bond: 0, equity: 0, gold: 0 });
          const [sliders, setSliders] = useState({ cash: 25, bond: 25, equity: 25, gold: 25 });
          const [history, setHistory] = useState([]);
          const [targets, setTargets] = useState([]);
          
          const wealth = Object.values(holdings).reduce((s, v) => s + v, 0);
          const ready = true; 

          // --- SMOOTH PRO-RATA AUTO-BALANCING LOGIC ---
          const handleSliderChange = (changedKey, newValue) => {
            let newSliders = { ...sliders, [changedKey]: newValue };
            let remainder = 100 - newValue;
            
            let otherKeys = ASSETS.map(a => a.key).filter(k => k !== changedKey);
            let oldSumOthers = otherKeys.reduce((acc, k) => acc + sliders[k], 0);

            if (oldSumOthers === 0) {
                // ถ้าสัดส่วนอื่นเป็น 0 หมด ให้เกลี่ยเท่าๆ กัน
                let share = Math.floor(remainder / 3);
                otherKeys.forEach(k => newSliders[k] = share);
                newSliders[otherKeys[0]] += remainder - (share * 3); // ปัดเศษให้ตัวแรก
            } else {
                // คำนวณแบบ Pro-rata (สัดส่วนตามน้ำหนักเดิม)
                let allocated = 0;
                let fractions = [];
                
                otherKeys.forEach(k => {
                    let exact = (sliders[k] / oldSumOthers) * remainder;
                    let rounded = Math.floor(exact);
                    newSliders[k] = rounded;
                    allocated += rounded;
                    fractions.push({ key: k, frac: exact - rounded });
                });

                // นำเศษทศนิยมที่เหลือมาบวกให้ตัวที่มีเศษเยอะสุด เพื่อให้รวมได้ 100 พอดี
                let diff = remainder - allocated;
                fractions.sort((a, b) => b.frac - a.frac);
                for (let i = 0; i < diff; i++) {
                    newSliders[fractions[i].key] += 1;
                }
            }
            setSliders(newSliders);
          };

          const handlePreset = (presetVals) => {
            setSliders(presetVals);
          };

          const processTurn = (currentHold, currentW, t) => {
            const w = Object.values(currentHold).reduce((s, v) => s + v, 0);
            const total = w + DCA;
            const newHold = {};
            ASSETS.forEach((a) => { newHold[a.key] = total * currentW[a.key]; });
            const { card, r } = deck[t];
            ASSETS.forEach((a) => { newHold[a.key] *= 1 + r[a.key]; });
            const endW = Object.values(newHold).reduce((s, v) => s + v, 0);
            return { newHold, historyItem: { turn: t + 1, card, r, startW: total, endW, ret: endW / total - 1 } };
          };

          const lockAndReveal = () => {
            if (!ready) return;
            const w = { cash: sliders.cash / 100, bond: sliders.bond / 100, equity: sliders.equity / 100, gold: sliders.gold / 100 };
            const { newHold, historyItem } = processTurn(holdings, w, turn);
            setHoldings(newHold);
            setTargets([...targets, w]);
            setHistory([...history, historyItem]);
            setPhase("result");
          };

          const autoPlayToEnd = () => {
             if (!ready) return;
             const w = { cash: sliders.cash / 100, bond: sliders.bond / 100, equity: sliders.equity / 100, gold: sliders.gold / 100 };
             let tempHold = { ...holdings };
             let newHistory = [...history];
             let newTargets = [...targets];

             for (let t = turn; t < TURNS; t++) {
                 const { newHold, historyItem } = processTurn(tempHold, w, t);
                 tempHold = newHold;
                 newHistory.push(historyItem);
                 newTargets.push(w);
             }
             setHoldings(tempHold);
             setHistory(newHistory);
             setTargets(newTargets);
             setTurn(TURNS - 1); // Jump to end
             setPhase("summary");
          };

          const nextTurn = () => {
            if (turn + 1 >= TURNS) { setPhase("summary"); return; }
            const w = wealth;
            const drift = {};
            let acc = 0;
            ASSETS.forEach((a, i) => {
              if (i < 3) { drift[a.key] = Math.round((holdings[a.key] / w) * 100); acc += drift[a.key]; }
            });
            drift.gold = Math.max(0, 100 - acc);
            setSliders(drift);
            setTurn(turn + 1);
            setPhase("allocate");
          };

          const playAgain = () => {
            setDeck(generateDeck());
            setTurn(0); setPhase("start");
            setHoldings({ cash: START, bond: 0, equity: 0, gold: 0 });
            setSliders({ cash: 25, bond: 25, equity: 25, gold: 25 });
            setHistory([]); setTargets([]);
          };

          const summary = useMemo(() => {
            if (phase !== "summary" || history.length < TURNS) return null;
            const finalW = history[TURNS - 1].endW;
            const invested = START + DCA * TURNS;
            const twr = history.reduce((p, h) => p * (1 + h.ret), 1);
            const cagr = Math.pow(twr, 1 / TURNS) - 1;
            const worst = history.reduce((m, h) => (h.ret < m.ret ? h : m), history[0]);
            const best = history.reduce((m, h) => (h.ret > m.ret ? h : m), history[0]);
            const avgW = { cash: 0, bond: 0, equity: 0, gold: 0 };
            targets.forEach((t) => ASSETS.forEach((a) => { avgW[a.key] += t[a.key] / targets.length; }));
            const type = investorType(avgW, worst.ret);
            const badges = [];
            if (finalW >= TARGET_W) badges.push({ emoji: "🏆", name: "ผู้พิชิตเป้า 4%", desc: "เติบโตถึงเป้าหมายสำหรับเตรียมเกษียณ" });
            if (finalW >= INFL_W) badges.push({ emoji: "📈", name: "ผู้ชนะเงินเฟ้อ", desc: "มูลค่าเงินเติบโตเอาชนะข้าวของที่แพงขึ้น" });
            if (worst.ret >= -0.10) badges.push({ emoji: "🛡️", name: "กลยุทธ์มั่นคง", desc: "ไม่เคยขาดทุนเกิน 10% ในปีเดียว" });
            
            const panicked = history.some((h, i) =>
              (h.card.id === "crash" || h.card.id === "bear") && i + 1 < targets.length &&
              targets[i + 1].equity < targets[i].equity - 0.001);
            
            if (!panicked) badges.push({ emoji: "🧘", name: "ใจสู้ไม่ถอย", desc: "ไม่แพนิคเทขายหุ้นทิ้งหลังเจอวิกฤตตลาด" });
            
            const level = finalW >= TARGET_W ? "win" : finalW >= INFL_W ? "mid" : "lose";
            const eq100 = runBenchmark(deck, { cash: 0, bond: 0, equity: 1, gold: 0 });
            const cash100 = runBenchmark(deck, { cash: 1, bond: 0, equity: 0, gold: 0 });
            const initMix = runBenchmark(deck, targets[0]);
            
            const chart = history.map((h, i) => ({
              year: i + 1, "พอร์ตของคุณ": h.endW, "หุ้น 100%": eq100[i], "เงินสด 100%": cash100[i], "ถือตามสัดส่วนปีแรก": initMix[i],
            }));
            
            return { finalW, invested, cagr, worst, best, type, badges, level, chart };
          }, [phase, history, targets, deck]);

          const wealthChart = history.map((h) => ({ year: h.turn, wealth: h.endW, pace: paceAt(h.turn) }));
          const cur = history[history.length - 1];

          // ---------------- Social Share ----------------
          const handleShare = () => {
            if (!summary) return;
            const text = `เกมจำลองการลงทุน 10 ปี 📈\nฉันได้ฉายา "${summary.type.name} ${summary.type.emoji}"\nเงินลงทุน ${fmtShort(summary.invested)} โตเป็น ${fmtShort(summary.finalW)}\nผลตอบแทนเฉลี่ย ${pctf(summary.cagr)} ต่อปี!\n\nมาทดสอบทักษะการลงทุนของคุณได้ที่นี่เลย! 👉🏻 https://reddogboy.github.io/10yrs-investment-game/`;
            navigator.clipboard.writeText(text).then(() => {
                alert("คัดลอกผลลัพธ์แล้ว! นำไปวางแชร์ให้เพื่อนๆ ในโซเชียลได้เลยครับ 🎉");
            }).catch(err => {
                alert("เกิดข้อผิดพลาดในการคัดลอก กรุณาลองใหม่อีกครั้ง");
            });
          };

          return (
            <div style={{
              minHeight: "100vh", background: C.bg, color: C.ink,
              fontFamily: "'Segoe UI', system-ui, -apple-system, sans-serif", padding: "12px 12px 28px",
            }}>
              <div style={{ maxWidth: 480, margin: "0 auto" }}>

                {/* Header with Attribution */}
                <div style={{
                  display: "flex", alignItems: "center", gap: 12, marginBottom: 8,
                  background: C.card, border: `1px solid ${C.line}`, borderLeft: `4px solid ${C.gold}`,
                  borderRadius: 12, padding: "12px",
                }}>
                  <div style={{flex: 1}}>
                    <div style={{ fontSize: 16, fontWeight: 700, color: C.teal }}>
                      เกมจำลองการลงทุน 10 ปี
                      <span style={{ fontSize: 10, fontWeight: 700, color: C.gold, background: C.goldSoft, borderRadius: 20, padding: "2px 8px", marginLeft: 8, verticalAlign: "middle" }}>v.1.3</span>
                    </div>
                    <div style={{ fontSize: 11, color: C.muted, marginTop: 4 }}>เอาชีวิตรอดในตลาดการเงิน · <span style={{color: C.gold}}>Inspired by DekFinance</span></div>
                  </div>
                </div>

                {phase !== "summary" && phase !== "start" && <TurnDots turn={turn + (phase === "result" ? 1 : 0)} />}

                {/* ---------- START PHASE ---------- */}
                {phase === "start" && (
                  <div style={{ animation: "fadeIn 0.3s ease-out" }}>
                    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 14px", marginBottom: 8, textAlign: "center" }}>
                      <div style={{ fontSize: 31 }}>🎮</div>
                      <div style={{ fontSize: 16, fontWeight: 800, color: C.teal, marginBottom: 8 }}>ภารกิจ 10 ปีของคุณ</div>
                      <div style={{ fontSize: 12.5, color: C.ink, lineHeight: 1.7, textAlign: "left" }}>
                        • เริ่มต้นด้วยเงินลงทุน <b>฿1,000,000</b> และลงทุนเพิ่ม (DCA) <b>฿100,000 ทุกปี</b> — ภายในปีที่ 10 คุณจะใช้เงินทุนไปรวม <b>฿2,000,000</b><br />
                        • ในแต่ละปี ให้กำหนดสัดส่วนการลงทุนของคุณ <b>ก่อนที่</b> จะเปิดเผยสภาพตลาด<br />
                        • เหตุการณ์แบบสุ่มจะเกิดขึ้น — รวมถึงวิกฤตตลาดพังทลาย 💥 อย่างน้อย 1 ครั้ง
                      </div>
                    </div>
                    <div style={{ background: C.goldSoft, border: `1px solid ${C.gold}44`, borderRadius: 12, padding: "9px 12px", marginBottom: 8 }}>
                      <div style={{ fontSize: 12.5, fontWeight: 800, color: C.ink, marginBottom: 4 }}>🎯 เป้าหมายของคุณ</div>
                      <div style={{ fontSize: 12, color: C.ink, lineHeight: 1.7 }}>
                        เอาชนะเงินเฟ้อ (2.5%/ปี) เป็นอย่างน้อย — ต้องมีเงินจบเกมมากกว่า <b>{fmtShort(INFL_W)}</b><br />
                        ทำผลตอบแทนให้ถึง <b style={{ color: C.gold }}>4%/ปี</b> — จบเกมด้วยเงินมากกว่า <b style={{ color: C.gold }}>{fmtShort(TARGET_W)}</b> — เพื่อให้พอร์ตเติบโตพอใช้หลังเกษียณ
                      </div>
                    </div>
                    
                    <button onClick={() => setPhase("allocate")} style={{
                      width: "100%", padding: "12px 0", borderRadius: 12, border: "none",
                      background: C.teal, color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer",
                      boxShadow: "0 4px 6px rgba(14,90,95,0.2)"
                    }}>▶️ เริ่มเกมเลย</button>
                  </div>
                )}

                {/* ---------- ALLOCATE PHASE ---------- */}
                {phase === "allocate" && (
                  <div style={{ animation: "fadeIn 0.3s ease-out" }}>
                    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 14px", marginBottom: 8 }}>
                      <div style={{ fontSize: 14, fontWeight: 700, color: C.teal, marginBottom: 2 }}>
                        ปีที่ {turn + 1} จาก {TURNS} — จัดสัดส่วนพอร์ตของคุณ
                      </div>
                      <div style={{ fontSize: 11.5, color: C.muted }}>
                        ความมั่งคั่ง: <b style={{ color: C.ink }}>{fmt(wealth)}</b> + <b style={{ color: C.green }}>ลงทุนเพิ่ม (DCA) ฿100,000</b>
                      </div>
                    </div>

                    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 14px", marginBottom: 8 }}>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
                        <div style={{fontSize: 11, width: '100%', fontWeight: '700', color: C.muted, marginBottom: 2}}>⚡ จัดพอร์ตด่วน (Quick Presets):</div>
                        {PRESETS.map(p => (
                            <button key={p.name} onClick={() => handlePreset(p.vals)}
                                style={{ flex: "1 1 calc(50% - 6px)", fontSize: 11, padding: "7px 6px", borderRadius: 8, background: C.tealSoft, color: C.teal, border: "none", cursor: "pointer", fontWeight: 700 }}>
                                {p.name}
                            </button>
                        ))}
                      </div>

                      {ASSETS.map((a) => (
                        <AllocSlider key={a.key} asset={a} value={sliders[a.key]}
                          onChange={(v) => handleSliderChange(a.key, v)} />
                      ))}
                      <MixBar weights={sliders} />
                      <div style={{ fontSize: 10, color: C.muted, marginTop: 8, textAlign: 'center' }}>
                        *ระบบจะเกลี่ยสัดส่วนให้ครบ 100% อัตโนมัติเมื่อคุณเลื่อนแถบ
                      </div>
                    </div>

                    <div style={{display: 'flex', gap: 8}}>
                        <button onClick={lockAndReveal} style={{
                          flex: 2, padding: "12px 0", borderRadius: 12, border: "none",
                          background: C.teal, color: "#fff", fontSize: 14.5, fontWeight: 700, cursor: "pointer",
                          boxShadow: "0 4px 6px rgba(14,90,95,0.2)"
                        }}>🔒 ยืนยันพอร์ตปีนี้</button>
                        
                        <button onClick={autoPlayToEnd} style={{
                          flex: 1, padding: "12px 0", borderRadius: 12, border: "none",
                          background: C.goldSoft, color: "#96731E", fontSize: 12, fontWeight: 700, cursor: "pointer",
                        }}>⏩ ลุยยาวจนจบ</button>
                    </div>
                  </div>
                )}

                {/* ---------- RESULT PHASE ---------- */}
                {phase === "result" && cur && (
                  <div style={{ animation: "slideUp 0.3s ease-out" }}>
                    <div style={{
                      background: C.card, border: `1px solid ${C.line}`, borderTop: `4px solid ${cur.ret >= -0.15 ? C.green : '#991B1B'}`,
                      borderRadius: 12, padding: "10px 16px", marginBottom: 8, textAlign: "center",
                    }}>
                      <div style={{ fontSize: 31 }}>{cur.card.emoji}</div>
                      <div style={{ fontSize: 17, fontWeight: 800, color: C.ink }}>{cur.card.name}</div>
                      <div style={{ fontSize: 11.5, color: C.muted, marginTop: 2 }}>{cur.card.desc}</div>
                    </div>

                    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "9px 12px", marginBottom: 8 }}>
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                        {ASSETS.map((a) => {
                          const isCrash = cur.r[a.key] <= -0.20;
                          return (
                          <div key={a.key} style={{
                            flex: "1 1 90px", textAlign: "center", background: C.bg,
                            border: `1px solid ${isCrash ? '#FCA5A5' : C.line}`, borderRadius: 8, padding: "8px 4px",
                          }}>
                            <div style={{ fontSize: 11, fontWeight: 700, color: a.color }}>{a.name}</div>
                            <div className={isCrash ? "crash-text" : ""} style={{ fontSize: 14, fontWeight: 800, color: cur.r[a.key] >= 0 ? C.green : C.red }}>
                              {pctf(cur.r[a.key])}
                            </div>
                          </div>
                        )})}
                      </div>
                      <div style={{
                        marginTop: 12, padding: "7px 10px", borderRadius: 8,
                        background: cur.ret >= 0 ? C.greenSoft : (cur.ret <= -0.15 ? '#FEE2E2' : C.redSoft), textAlign: "center",
                      }}>
                        <span style={{ fontSize: 12, color: C.muted }}>พอร์ตของคุณ: </span>
                        <b className={cur.ret <= -0.20 ? "crash-text" : ""} style={{ fontSize: 15, color: cur.ret >= 0 ? C.green : C.red }}>{pctf(cur.ret)}</b>
                        <div style={{ fontSize: 11.5, color: C.muted, marginTop: 2 }}>
                          {fmt(cur.startW)} → <b style={{ color: C.ink }}>{fmt(cur.endW)}</b>
                        </div>
                        <div style={{ fontSize: 11.5, fontWeight: 700, marginTop: 5, color: cur.endW >= paceAt(cur.turn) ? C.green : C.red }}>
                          {cur.endW >= paceAt(cur.turn) ? "▲ นำหน้าเป้า 4%" : "▼ ตามหลังเป้า 4%"} ({fmtShort(paceAt(cur.turn))}) อยู่ {fmtShort(Math.abs(cur.endW - paceAt(cur.turn)))}
                        </div>
                      </div>
                    </div>

                    {wealthChart.length > 1 && (
                      <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "8px 8px 2px 0", marginBottom: 8 }}>
                        <div style={{ fontSize: 11.5, fontWeight: 700, paddingLeft: 16, marginBottom: 2 }}>
                          ความมั่งคั่งสะสม <span style={{ fontWeight: 500, color: C.muted }}>· เส้นประสีทอง = เป้า 4%</span>
                        </div>
                        <ResponsiveContainer width="100%" height={118}>
                          <LineChart data={wealthChart} margin={{ top: 6, right: 14, left: 4, bottom: 0 }}>
                            <CartesianGrid stroke={C.line} strokeDasharray="3 3" vertical={false} />
                            <XAxis dataKey="year" tick={{ fontSize: 10, fill: C.muted }} tickLine={false} axisLine={{ stroke: C.line }} />
                            <YAxis tickFormatter={fmtShort} tick={{ fontSize: 10, fill: C.muted }} tickLine={false} axisLine={false} width={52} />
                            <Tooltip formatter={(v, n) => [fmt(v), n === "pace" ? "เป้าหมาย 4%" : "เงินของคุณ"]} labelFormatter={(l) => `ปีที่ ${l}`}
                              contentStyle={{ borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 11.5 }} />
                            <Line type="monotone" dataKey="wealth" stroke={C.teal} strokeWidth={2.2} dot={{ r: 3 }} />
                            <Line type="monotone" dataKey="pace" stroke={C.gold} strokeWidth={1.8} dot={false} strokeDasharray="6 3" />
                          </LineChart>
                        </ResponsiveContainer>
                      </div>
                    )}

                    <button onClick={nextTurn} style={{
                      width: "100%", padding: "12px 0", borderRadius: 12, border: "none",
                      background: C.gold, color: "#fff", fontSize: 14.5, fontWeight: 700, cursor: "pointer",
                      boxShadow: "0 4px 6px rgba(201,160,44,0.3)"
                    }}>
                      {turn + 1 >= TURNS ? "🏁 ดูผลสรุป 10 ปี" : `ไปต่อปีถัดไป →`}
                    </button>
                  </div>
                )}

                {/* ---------- SUMMARY PHASE ---------- */}
                {phase === "summary" && summary && (
                  <div style={{ animation: "fadeIn 0.5s ease-out" }}>
                    <div style={{
                      background: C.card, border: `1px solid ${C.line}`, borderTop: `4px solid ${C.gold}`,
                      borderRadius: 12, padding: "12px 14px", marginBottom: 8, textAlign: "center",
                    }}>
                      <div style={{ fontSize: 35 }}>{summary.type.emoji}</div>
                      <div style={{ fontSize: 18, fontWeight: 800, color: C.teal }}>{summary.type.name}</div>
                      <div style={{ fontSize: 11.5, color: C.muted, marginTop: 2 }}>{summary.type.desc}</div>
                      <div style={{ marginTop: 12, fontSize: 26, fontWeight: 800, color: C.ink, fontVariantNumeric: "tabular-nums" }}>
                        {fmt(summary.finalW)}
                      </div>
                      <div style={{ fontSize: 11, color: C.muted }}>ความมั่งคั่งสุทธิ · (ลงทุนไปทั้งหมด {fmt(summary.invested)})</div>
                      <div style={{
                        marginTop: 10, borderRadius: 8, padding: "8px 10px", fontSize: 12, fontWeight: 700,
                        background: summary.level === "win" ? C.greenSoft : summary.level === "mid" ? C.goldSoft : C.redSoft,
                        color: summary.level === "win" ? C.green : summary.level === "mid" ? "#96731E" : C.red,
                      }}>
                        {summary.level === "win" && `🎯 สำเร็จ! ความมั่งคั่งของคุณทะลุเป้าหมาย 4%/ปี (${fmtShort(TARGET_W)})`}
                        {summary.level === "mid" && `📈 คุณเอาชนะเงินเฟ้อได้ (${fmtShort(INFL_W)}) แต่ยังไปไม่ถึงเป้า 4% (${fmtShort(TARGET_W)}) — การลงทุนจริงต้องใช้เวลาหลายทศวรรษ!`}
                        {summary.level === "lose" && `🔻 คุณแพ้เงินเฟ้อ (${fmtShort(INFL_W)}) — อำนาจการซื้อของเงินคุณลดลง`}
                      </div>
                    </div>

                    <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 8 }}>
                      {[
                        ["เงินลงทุนสะสม", fmt(summary.invested)],
                        ["กำไรสุทธิ", fmt(summary.finalW - summary.invested)],
                        ["ผลตอบแทนเฉลี่ย", pctf(summary.cagr) + "/ปี"],
                        ["ปีที่ผลงานดีสุด", `ปีที่ ${summary.best.turn} ${summary.best.card.emoji} ${pctf(summary.best.ret)}`],
                        ["ปีที่ผลงานแย่สุด", `ปีที่ ${summary.worst.turn} ${summary.worst.card.emoji} ${pctf(summary.worst.ret)}`],
                      ].map(([l, v]) => (
                        <div key={l} style={{
                          flex: "1 1 130px", background: C.card, border: `1px solid ${C.line}`,
                          borderRadius: 10, padding: "7px 10px",
                        }}>
                          <div style={{ fontSize: 10, letterSpacing: 0.6, color: C.muted, fontWeight: 600 }}>{l}</div>
                          <div style={{ fontSize: 14, fontWeight: 700, color: C.teal, marginTop: 2 }}>{v}</div>
                        </div>
                      ))}
                    </div>

                    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "9px 12px", marginBottom: 8 }}>
                      <div style={{ fontSize: 11.5, fontWeight: 700, marginBottom: 8 }}>🏅 เหรียญตราที่ได้รับ</div>
                      {summary.badges.length === 0 ? (
                        <div style={{ fontSize: 11.5, color: C.muted }}>คุณไม่ได้เหรียญตราเลยในรอบนี้ — ลองปรับพอร์ตแล้วเล่นใหม่นะ!</div>
                      ) : (
                        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                          {summary.badges.map((b) => (
                            <div key={b.name} style={{ display: "flex", gap: 8, alignItems: "center", background: C.bg, borderRadius: 8, padding: "6px 10px" }}>
                              <span style={{ fontSize: 17 }}>{b.emoji}</span>
                              <span style={{ fontSize: 12, fontWeight: 700 }}>{b.name}</span>
                              <span style={{ fontSize: 10.5, color: C.muted }}>· {b.desc}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "8px 8px 2px 0", marginBottom: 8 }}>
                      <div style={{ fontSize: 11.5, fontWeight: 700, paddingLeft: 16, marginBottom: 2 }}>
                        คุณ เทียบกับ เกณฑ์มาตรฐาน <span style={{ fontWeight: 500, color: C.muted }}>· ในช่วง 10 ปีเดียวกันนี้</span>
                      </div>
                      <ResponsiveContainer width="100%" height={178}>
                        <LineChart data={summary.chart} margin={{ top: 6, right: 14, left: 4, bottom: 0 }}>
                          <CartesianGrid stroke={C.line} strokeDasharray="3 3" vertical={false} />
                          <XAxis dataKey="year" tick={{ fontSize: 10, fill: C.muted }} tickLine={false} axisLine={{ stroke: C.line }} />
                          <YAxis tickFormatter={fmtShort} tick={{ fontSize: 10, fill: C.muted }} tickLine={false} axisLine={false} width={52} />
                          <Tooltip formatter={(v, n) => [fmt(v), n]} labelFormatter={(l) => `ปีที่ ${l}`}
                            contentStyle={{ borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 11 }} />
                          <Legend wrapperStyle={{ fontSize: 10.5 }} />
                          <Line type="monotone" dataKey="พอร์ตของคุณ" stroke={C.teal} strokeWidth={2.6} dot={false} />
                          <Line type="monotone" dataKey="หุ้น 100%" stroke={C.rust} strokeWidth={1.6} dot={false} strokeDasharray="5 3" />
                          <Line type="monotone" dataKey="เงินสด 100%" stroke={C.muted} strokeWidth={1.6} dot={false} strokeDasharray="5 3" />
                          <Line type="monotone" dataKey="ถือตามสัดส่วนปีแรก" stroke={C.gold} strokeWidth={1.6} dot={false} strokeDasharray="5 3" />
                        </LineChart>
                      </ResponsiveContainer>
                    </div>

                    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 14px", marginBottom: 12 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 8 }}>ประวัติการจัดพอร์ต 10 ปีของคุณ (History Log)</div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                        {history.map((h, i) => (
                          <div key={h.turn} style={{ 
                              background: h.ret >= 0 ? C.greenSoft : C.redSoft, 
                              borderRadius: 8, padding: "8px 12px", border: `1px solid ${h.ret >= 0 ? C.green : C.red}33`
                          }}>
                              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                                  <span style={{ fontSize: 13, fontWeight: 700, color: C.ink }}>ปีที่ {h.turn}: {h.card.emoji} {h.card.name}</span>
                                  <span style={{ fontSize: 14, fontWeight: 800, color: h.ret >= 0 ? C.green : C.red }}>{pctf(h.ret)}</span>
                              </div>
                              <div style={{ fontSize: 10.5, color: C.muted, display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                                 <span style={{color: C.teal}}>หุ้น {Math.round(targets[i].equity * 100)}%</span>
                                 <span style={{color: C.gold}}>ทอง {Math.round(targets[i].gold * 100)}%</span>
                                 <span style={{color: C.blue}}>หนี้ {Math.round(targets[i].bond * 100)}%</span>
                                 <span style={{color: C.muted}}>เงินสด {Math.round(targets[i].cash * 100)}%</span>
                              </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <button onClick={handleShare} style={{
                      width: "100%", padding: "12px 0", borderRadius: 12, border: `2px solid ${C.teal}`,
                      background: "#fff", color: C.teal, fontSize: 14.5, fontWeight: 700, cursor: "pointer", marginBottom: 8,
                      boxShadow: "0 2px 6px rgba(14,90,95,0.1)"
                    }}>📤 แชร์ผลลัพธ์ให้เพื่อน (คัดลอกข้อความ)</button>

                    <button onClick={playAgain} style={{
                      width: "100%", padding: "12px 0", borderRadius: 12, border: "none",
                      background: C.teal, color: "#fff", fontSize: 14.5, fontWeight: 700, cursor: "pointer",
                      boxShadow: "0 4px 6px rgba(14,90,95,0.2)"
                    }}>🔄 เล่นอีกครั้ง (สุ่มเหตุการณ์ใหม่ 10 ปี)</button>
                  </div>
                )}

                {/* Footer with Attribution */}
                <div style={{ fontSize: 10.5, color: C.muted, lineHeight: 1.55, marginTop: 12, textAlign: "justify" }}>
                  <b>กติกา:</b> เริ่มต้นด้วย ฿1M + เพิ่ม (DCA) ฿100K ทุกปี · วิกฤตตลาดเกิดอย่างน้อย 1 ครั้ง/ทศวรรษ · 
                  หุ้นสวิง −40% ถึง +32% (อิงประวัติศาสตร์ S&P 500) · ภาวะวิกฤตอาจลากยาวเข้าสู่ 🐻 ตลาดหมี · ทองคำมักสวนทางกับหุ้น<br/>
                  <div style={{marginTop: 6, borderTop: `1px solid ${C.line}`, paddingTop: 6, textAlign: "center"}}>
                     💡 เกมนี้จัดทำขึ้นเพื่อการศึกษาจำลองความผันผวน แปลเป็นภาษาไทย จาก <br/>
                     <b>ต้นฉบับแนวคิดและโค้ดดั้งเดิมโดย: <span style={{color: C.gold}}>DekFinance (เด็กการเงิน)</span> https://claude.ai/public/artifacts/418a6350-45c9-457b-a818-9afb0a7e4b0e</b>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
